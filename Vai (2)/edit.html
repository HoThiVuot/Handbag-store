<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sửa sản phẩm - BAGS STYLE 2026</title>
    <link rel="stylesheet" href="project.css" />
  </head>
  <body>
    <header class="main-header">
      <h1>SỬA SẢN PHẨM</h1>
      <a href="sanpham.html" class="admin-link">QUAY LẠI QUẢN TRỊ</a>
    </header>

    <main class="form-container">
      <form id="edit-form">
        <div class="form-group">
          <label for="edit-selector">Chọn sản phẩm cần sửa</label>
          <select id="edit-selector" required></select>
        </div>

        <div class="form-group">
          <label for="edit-name">Tên sản phẩm</label>
          <input type="text" id="edit-name" required />
        </div>

        <div class="form-group">
          <label for="edit-price">Giá sản phẩm ($)</label>
          <input type="number" id="edit-price" min="0" step="1" required />
        </div>

        <div class="form-group">
          <label for="edit-img">Đường dẫn hình ảnh</label>
          <input type="url" id="edit-img" required />
        </div>

        <div class="form-group">
          <label for="edit-description">Mô tả sản phẩm</label>
          <textarea
            id="edit-description"
            rows="5"
            placeholder="Nhập mô tả sản phẩm..."
            required
          ></textarea>
        </div>

        <div class="form-group">
          <label for="edit-badge">Nhãn sản phẩm</label>
          <select id="edit-badge">
            <option value="badge-new">MỚI</option>
            <option value="badge-sale">GIẢM GIÁ</option>
            <option value="none">Không có nhãn</option>
          </select>
          <div class="form-group">
            <label for="edit-category">Danh mục</label>
            <select id="edit-category">
              <option value="nu">Nữ</option>
              <option value="nam">Nam</option>
              <option value="thethao">Thể Thao</option>
              <option value="treem">Trẻ Em</option>
            </select>
          </div>
        </div>

        <button type="submit" class="nut-chinh">LƯU THAY ĐỔI</button>
      </form>
    </main>

    <script src="project.js"></script>
  </body>
</html>
